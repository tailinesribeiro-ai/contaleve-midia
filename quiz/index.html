<style>
*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: jogo de uma coluna para celular. Identidade Conta Leve fixa (tema único claro), igual em qualquer aparelho. */
:root{
  color-scheme:light;
  --bg:#F5EFE6; --surface:#FFFBF4; --ink:#3B2A20; --muted:#6E5D50;
  --forest:#1F3D2B; --olive:#5B6B3A; --terra:#B5652F; --line:#E3D8C8;
  --chip:#EFE6D8; --cream:#F5EFE6; --sel:#E4EBDD;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --pixel:"Press Start 2P","Courier New",monospace;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px 40px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px}
.top b{font-family:var(--display);font-size:20px;color:var(--forest)}
.top b em{color:var(--terra)}
.snd{all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--forest)}
.snd:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:clamp(25px,6.8vw,31px)}
h2 em,h3 em{font-style:normal;color:var(--terra)}
.screen{display:flex;flex-direction:column;gap:16px;animation:in .4s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:.001;transform:translateY(12px)}to{opacity:1;transform:none}}
.hello{margin:0;border-radius:24px;overflow:hidden;background:var(--forest);color:var(--cream)}
.hello img{width:100%;max-width:100%;aspect-ratio:720/430;object-fit:cover;object-position:50% 35%;display:block}
.hello figcaption{padding:16px 18px 20px;display:flex;flex-direction:column;gap:6px}
.hello h1{font-size:clamp(27px,7.4vw,34px);color:var(--cream)}
.hello h1 em{font-style:normal;color:#E7A56F}
.hello p{margin:0;font-size:15.5px;opacity:.92}
.go-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:12px}
.bubble{background:#FFFBF4;color:#1F3D2B;font-family:var(--pixel);font-size:9px;line-height:1.4;padding:7px 10px;border-radius:6px;border:2px solid #3B2A20;position:relative;animation:ghost 2.6s ease-in-out infinite;transition:opacity .2s}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#3B2A20}
@keyframes ghost{0%,100%{opacity:.15;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
.go-wrap:hover .bubble,.go-wrap:focus-within .bubble,.go-wrap:active .bubble{animation:none;opacity:1;transform:translateY(-4px)}
.play{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:13px 22px;border-radius:10px;background:#B5652F;color:#fff;font-family:var(--pixel);font-size:12px;border:3px solid #3B2A20;box-shadow:0 5px 0 #6E3612,0 5px 0 3px #3B2A20;animation:pulse 1.8s ease-out infinite;transition:transform .08s,box-shadow .08s}
.play .pl{width:22px;height:22px;border-radius:4px;border:2px solid #3B2A20;background:#FFFBF4;color:#B5652F;display:grid;place-items:center;font-size:9px;padding-left:2px;box-sizing:border-box}
.play:active{transform:translateY(5px);box-shadow:0 0 0 #6E3612,0 0 0 3px #3B2A20}
.play:focus-visible{outline:3px solid #FFFBF4;outline-offset:3px}
@keyframes pulse{0%{box-shadow:0 5px 0 #6E3612,0 5px 0 3px #3B2A20,0 0 0 0 rgba(231,165,111,.7)}70%{box-shadow:0 5px 0 #6E3612,0 5px 0 3px #3B2A20,0 0 0 14px rgba(231,165,111,0)}100%{box-shadow:0 5px 0 #6E3612,0 5px 0 3px #3B2A20,0 0 0 0 rgba(231,165,111,0)}}
.tiny{font-size:13px;opacity:.8}
.know{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--terra)}
.know .big{font-family:var(--display);font-weight:700;font-size:clamp(22px,6vw,27px);line-height:1.2;margin:0;text-wrap:balance}
.know .big em{font-style:normal;color:var(--terra)}
.bill{all:unset;box-sizing:border-box;cursor:pointer;display:flex;height:52px;border-radius:14px;overflow:hidden;gap:3px;background:var(--chip);position:relative}
.bill:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
.bill .cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--forest);background:repeating-linear-gradient(135deg,var(--chip) 0 12px,#E8DDCC 12px 24px);transition:opacity .35s}
.bill.open .cover{opacity:0;pointer-events:none}
.seg{height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;transform:scaleX(0);transform-origin:left;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .2s}
.bill.open .seg{transform:none}
.seg.dim{opacity:.3}
.legend{display:grid;gap:4px;font-size:14.5px}
.legend button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:5px 2px;border-radius:8px}
.legend button.dim{opacity:.4}
.legend .dot{width:12px;height:12px;border-radius:4px;flex:none}
.legend .val{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700}
.src{font-size:12px;color:var(--muted);margin:0}
.ask{display:flex;flex-direction:column;gap:12px}
.ask h2 small{display:block;font-family:var(--body);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--olive);margin-bottom:4px}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goal{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;min-height:120px;transition:transform .15s,border-color .15s,background .15s}
.goal:active{transform:scale(.96)}
.goal:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
.goal.on{background:var(--forest);color:var(--cream);border-color:var(--forest)}
.goal .ic{width:40px;height:40px;border-radius:12px;background:var(--chip);display:grid;place-items:center;color:var(--forest)}
.goal.on .ic{background:var(--terra);color:#fff}
.goal b{font-size:15px;line-height:1.3}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);justify-content:center}
.trail{background:var(--surface);border:3px solid #3B2A20;border-radius:14px;box-shadow:0 4px 0 #3B2A20;padding:12px 16px 14px;display:flex;flex-direction:column;gap:6px}
.trail .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;color:var(--muted)}
.trail .lbl span b{color:var(--ink);font-size:16px}
.trail .lbl .left{font-weight:700;color:var(--forest);background:var(--sel);padding:2px 10px;border-radius:99px;font-size:13px}
.track{position:relative;height:76px;margin:0 14px}
.track .road{position:absolute;left:0;right:0;top:61px;height:4px;border-radius:4px;background:var(--line)}
.track .done{position:absolute;left:0;top:61px;height:4px;width:0;border-radius:4px;background:var(--olive);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.node{position:absolute;top:56px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--surface);border:2.5px solid #CDBFAA;transition:background .3s,border-color .3s}
.node.pass{background:var(--olive);border-color:var(--olive)}
.node.end{width:24px;height:24px;margin-left:-12px;top:51px;border-radius:6px;border:2.5px solid var(--terra);background:var(--surface);display:grid;place-items:center;color:var(--terra)}
.pawn{position:absolute;top:2px;width:34px;margin-left:-17px;left:0;transition:left .6s cubic-bezier(.3,1.4,.5,1);z-index:2}
.pawn svg{display:block}
.pawn.hop svg{animation:hop .6s ease}
@keyframes hop{0%{transform:none}35%{transform:translateY(-12px) rotate(-6deg)}70%{transform:translateY(0) scaleY(.92)}100%{transform:none}}
.hint{font-size:14px;color:var(--muted);margin:0;background:var(--chip);border-radius:12px;padding:10px 14px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:15px 16px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);cursor:pointer;min-height:64px;transition:transform .15s,border-color .15s,background .15s}
.opt:active{transform:scale(.97)}
.opt:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
.opt.on{background:var(--forest);color:var(--cream);border-color:var(--forest)}
.opt.on .ic{background:var(--terra);color:#fff}
.opt.on .tx span{color:var(--cream);opacity:.85}
.opt .ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--chip);display:grid;place-items:center;color:var(--forest)}
.opt .tx{display:flex;flex-direction:column;min-width:0}
.opt .tx b{font-weight:700}
.opt .tx span{font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.uf{all:unset;box-sizing:border-box;text-align:center;padding:13px 0;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;cursor:pointer;transition:transform .15s}
.uf:active{transform:scale(.93)}
.uf:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
.uf.on{background:var(--forest);color:var(--cream);border-color:var(--forest)}
.ghost{all:unset;cursor:pointer;color:var(--muted);font-size:15px;padding:8px 2px}
.ghost:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.win{background:var(--forest);color:var(--cream);border-radius:24px;padding:20px 18px;display:flex;flex-direction:column;gap:10px}
.win small{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;font-weight:700}
.win h2{font-size:clamp(30px,8.6vw,40px);color:var(--cream)}
.win h2 em{color:#E7A56F}
.win p{margin:0}
.win .an{font-size:16.5px;font-weight:500;opacity:.92}
.map{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:16px 12px 14px;display:flex;flex-direction:column;gap:10px}
.map h3{font-size:22px;padding-inline:6px}
.map .sub{margin:0;font-size:14px;color:var(--muted);padding-inline:6px}
.map .key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);padding-inline:6px}
.map .key span{display:flex;align-items:center;gap:6px}
.map .key i{width:18px;height:4px;border-radius:2px;display:inline-block}
.map .key i.dash{background:repeating-linear-gradient(90deg,#CDBFAA 0 3px,transparent 3px 7px)}
.map svg{width:100%;max-width:100%;height:auto;display:block}
.map .path{fill:none;stroke-linecap:round}
.map .p-main{stroke:var(--terra);stroke-width:7;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.2s .3s cubic-bezier(.4,0,.2,1) forwards}
.map .p-yes{stroke:var(--olive);stroke-width:4}
.map .p-no{stroke:#D6C9B6;stroke-width:4;stroke-dasharray:2 9}
@keyframes draw{to{stroke-dashoffset:0}}
.dest{cursor:pointer}
.dest:focus{outline:none}
.dest:focus-visible circle.ring,.dest.sel circle.ring{stroke:var(--ink);stroke-width:3}
.dest text{font-family:var(--body);font-weight:700;fill:var(--ink)}
.panel{background:var(--bg);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;animation:in .3s cubic-bezier(.2,.8,.2,1)}
.panel .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel b.n{font-family:var(--display);font-size:21px}
.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.chip.main{background:var(--terra);color:#fff}
.chip.yes{background:var(--sel);color:var(--forest)}
.chip.no{background:var(--chip);color:var(--muted)}
.panel p{margin:0;font-size:15px}
.panel .an{font-family:var(--display);font-style:italic}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card h3{font-family:var(--body);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--olive)}
.card ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--sel);color:var(--forest);font-weight:700;font-size:14px;display:grid;place-items:center}
.warn{border-color:var(--terra)}
.warn h3{color:var(--terra)}
.cta{background:var(--surface);border:2px solid var(--forest);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.cta h3{font-size:22px}
.cta p{margin:0}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:13px 15px}
input[type=text]:focus{outline:none;border-color:var(--forest)}
.msg{font-size:14px;background:var(--chip);border-radius:14px;padding:12px 14px;white-space:pre-wrap}
.btn{all:unset;box-sizing:border-box;padding:16px 22px;border-radius:99px;background:var(--terra);color:#fff;font-weight:700;cursor:pointer;text-align:center;width:100%;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid var(--forest);outline-offset:2px}
.toast{font-size:14px;color:var(--olive);font-weight:700;min-height:20px}
.mv{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.mv .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mv h3{font-size:22px}
.mv .dots{display:flex;gap:5px}
.mv .dots i{width:9px;height:9px;border-radius:50%;background:var(--chip)}
.mv .dots i.ok{background:var(--forest)}.mv .dots i.err{background:var(--terra)}.mv .dots i.now{box-shadow:0 0 0 2px var(--olive)}
.mv .q{font-size:18px;font-weight:700;line-height:1.35;margin:0}
.mv .ch{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mv .ch button{all:unset;box-sizing:border-box;text-align:center;padding:14px;border-radius:14px;font-weight:700;cursor:pointer;border:1.5px solid var(--line);background:var(--chip);transition:transform .15s}
.mv .ch button:active{transform:scale(.95)}
.mv .ch button:focus-visible,.mv .nx:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
.mv .ch button.right{background:var(--forest);color:var(--cream);border-color:var(--forest)}
.mv .ch button.wrong{background:var(--terra);color:#fff;border-color:var(--terra)}
.mv .ans{background:var(--sel);border-radius:14px;padding:12px 14px;animation:in .3s cubic-bezier(.2,.8,.2,1)}
.mv .ans b{display:block}
.mv .nx{all:unset;cursor:pointer;font-weight:700;color:var(--forest);align-self:flex-end;padding:6px 2px}
.mv .end{font-family:var(--display);font-size:20px;margin:0}

/* ---- estilo de botão de videogame 16 bits: borda grossa, sombra dura e "afunda" ao tocar ---- */
.goal,.opt,.uf,.mv .ch button,.btn{border:3px solid #3B2A20;border-radius:10px;box-shadow:0 5px 0 #3B2A20;transition:transform .08s,box-shadow .08s,background .15s}
.goal:active,.opt:active,.uf:active,.mv .ch button:active,.btn:active{transform:translateY(5px);box-shadow:0 0 0 #3B2A20}
.goal.on,.opt.on,.uf.on{transform:translateY(5px);box-shadow:0 0 0 #3B2A20;border-color:#3B2A20}
.goal .ic,.opt .ic{border-radius:6px;border:2px solid #3B2A20}
.btn{box-shadow:0 6px 0 #6E3612,0 6px 0 3px #3B2A20;font-size:17px}
.btn:active{box-shadow:0 0 0 #6E3612,0 0 0 3px #3B2A20;transform:translateY(6px)}
.goals{gap:14px}.opts{gap:14px}.grid{gap:10px}
.btn.zap{background:#1F7A45;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 0 #0F4A28,0 6px 0 3px #3B2A20}
.btn.zap:active{box-shadow:0 0 0 #0F4A28,0 0 0 3px #3B2A20}
.btn2{all:unset;box-sizing:border-box;width:100%;text-align:center;padding:14px 20px;border-radius:10px;background:var(--surface);color:var(--forest);font-weight:700;cursor:pointer;border:3px solid #3B2A20;box-shadow:0 5px 0 #3B2A20;transition:transform .08s,box-shadow .08s}
.btn2:active{transform:translateY(5px);box-shadow:0 0 0 #3B2A20}
.btn2:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
.how h3{font-family:var(--display);font-size:21px;text-transform:none;letter-spacing:0;color:var(--ink);line-height:1.25}
.how .steps{gap:14px}
.how .steps li span{display:flex;flex-direction:column;font-size:14.5px;color:var(--muted)}
.how .steps li span b{font-size:16px;color:var(--ink)}
.how .steps li::before{background:var(--forest);color:var(--cream);border:2px solid #3B2A20}
.how .calm{margin:0;font-size:14px;font-weight:700;color:var(--olive)}
.win .elig{font-size:13.5px;background:rgba(245,239,230,.12);border-radius:10px;padding:8px 12px}
.panel .note{font-size:13px;color:var(--muted)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}
footer{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.map .p-main{stroke-dashoffset:0}}
</style>
</head>
<body>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="top"><b>Conta <em>Leve</em></b><button class="snd" id="snd" aria-label="Desligar som"></button></div>
  <div class="trail" id="trail" hidden>
    <div class="lbl"><span id="tTx">Pergunta 1</span><span class="left" id="tLeft"></span></div>
    <div class="track" id="track"><div class="road"></div><div class="done" id="done"></div><div class="pawn" id="pawn"></div></div>

/* ---------- som (Web Audio; só toca depois do primeiro toque) ---------- */
let som=true;try{som=localStorage.getItem("cl-som")!=="0"}catch(e){}
let ctx=null;
function ac(){if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ctx&&ctx.state==="suspended")ctx.resume();return ctx}
function tone(f,t0,d,type="sine",vol=.12){if(!som)return;const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02)}
const SFX={
 pop(){tone(988,0,.07,"square",.05);tone(1319,.07,.18,"square",.05)},

 win(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.28,"triangle",.11));tone(1319,.48,.45,"sine",.08)},

/* ---------- confete de folhas ---------- */
function confete(){
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 const cv=document.getElementById("fx"),c=cv.getContext("2d"),W=cv.width=innerWidth,H=cv.height=innerHeight;
 const cores=["#1F3D2B","#5B6B3A","#B5652F","#E7A56F"],ps=[];
 for(let i=0;i<70;i++)ps.push({x:W/2,y:H*.3,vx:(Math.random()-.5)*11,vy:-Math.random()*11-3,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,s:5+Math.random()*6,c:cores[i%4]});
 let t=0;(function f(){c.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.beginPath();c.ellipse(0,0,p.s,p.s/2.2,0,0,6.28);c.fill();c.restore()});if(++t<110)requestAnimationFrame(f);else c.clearRect(0,0,W,H)})();
}

/* ---------- lógica do resultado ---------- */
function cobertura(){
 if(FORA.includes(A.uf)||A.dist==="outra"||NAO_ATENDIDA.includes(A.dist))return "nao";
 if(A.dist==="naosei"||A_CONFIRMAR.includes(A.dist))return "confirmar";
 return "sim"}
function calc(){
 const cov=cobertura(),temCasa=A.tipo==="casa"||A.tipo==="comercio",proprio=A.posse==="proprio",telhadoOk=!!(temCasa&&A.telhado&&A.telhado!=="nao");
 let main;const porque=[],obs=[];let semGreen="";
 if(A.tipo==="grande"){main="livre";obs.push("Se a empresa não for ligada em alta tensão, a Conexão Green pode ser o caminho.")}
 else if(A.tipo==="apto"||!telhadoOk){main="green";porque.push(A.tipo==="apto"?"Em apartamento normalmente não há telhado só seu para placas.":"Sem telhado com sol, o desconto sem placa é o mais simples.")}
 else if(!proprio){main=A.invest==="sim"?"placas":"green";if(main==="placas")obs.push("Como o imóvel não é seu, a instalação precisa da autorização do dono.");else porque.push("Em imóvel que não é seu, o desconto sem placa não mexe em nada no imóvel.")}
 else{main=(A.invest==="sim"||A.multi==="sim")?"placas":"solar";if(A.telhado==="naosei")obs.push("A gente avalia o telhado com você antes de qualquer proposta.")}
 if(main==="solar"||main==="placas")obs.push("Confirmamos com a iGreen se a opção com placas atende a sua região.");
 if(main==="green"&&cov==="nao")semGreen="Hoje o desconto sem placa ainda não chega à sua região. Ele fica como uma possibilidade para o futuro: a gente deixa seu contato registrado e avisa se isso mudar. Enquanto isso, dá para conversar sobre celular e seguro.";
 if(cov==="confirmar")obs.push("Precisamos confirmar se a empresa de luz da sua região é atendida. É a primeira coisa que olhamos.");
 return {main,porque,obs,semGreen,cov,proprio,telhadoOk}}
function status(r,k){
 if(k===r.main)return {s:"main",chip:"Caminho mais provável",why:[(GOALS[A.goal]?"Você disse que quer "+GOALS[A.goal].frase+".":""),"Pelas suas respostas, este é o caminho mais provável. A confirmação vem na consulta de elegibilidade.",...r.porque].join(" ").trim()};
 const casaMsg="É para casas e pequenos negócios.";
 if(k==="green"){
  if(A.tipo==="grande")return {s:"no",chip:"Não é para agora",why:casaMsg};
  if(r.cov==="nao")return {s:"no",chip:"Possibilidade futura",why:"Hoje a Conexão Green ainda não chega à empresa de luz da sua região. A gente deixa seu contato registrado e avisa se isso mudar."};
  return {s:"yes",chip:"Outra possibilidade",why:"Se você preferir não instalar nada, dá para começar pelo desconto sem obra."}}
 if(k==="solar"){
  if(A.tipo==="grande")return {s:"no",chip:"Não é para agora",why:casaMsg};
  if(A.tipo==="apto")return {s:"no",chip:"Não é para agora",why:"Precisa de um telhado próprio, e apartamento normalmente não tem."};
  if(!r.proprio)return {s:"no",chip:"Não é para agora",why:"Precisa ser imóvel próprio, porque o telhado fica cedido por alguns anos."};
  if(!r.telhadoOk)return {s:"no",chip:"Não é para agora",why:"Precisa de telhado que pegue sol."};
  return {s:"yes",chip:"Outra possibilidade",why:"Se você preferir não investir, as placas podem ser instaladas sem custo de entrada, caso o imóvel seja aprovado na consulta de elegibilidade."}}
 if(k==="placas"){
  if(A.tipo==="grande")return {s:"no",chip:"Não é para agora",why:casaMsg};
  if(A.tipo==="apto")return {s:"no",chip:"Não é para agora",why:"Precisa de um telhado para as placas, e apartamento normalmente não tem."};
  if(!r.telhadoOk)return {s:"no",chip:"Não é para agora",why:"Precisa de telhado que pegue sol."};
  return {s:"yes",chip:"Outra possibilidade",why:r.proprio?"Se um dia quiser investir, o sistema é seu desde o primeiro dia.":"Dá para fazer com a autorização do dono do imóvel."}}
 return {s:"no",chip:"Não é para agora",why:"É para empresas de consumo muito alto, ligadas em alta tensão."}}
function mapa(r){
 const ks=["green","solar","placas","livre"],X=[48,136,224,312],sx=180,sy=262,y=96;
 let paths="",dests="",main="";
 ks.forEach((k,i)=>{const st=status(r,k),x=X[i];
  const d=`M${sx} ${sy} C ${sx} ${sy-70}, ${x} ${y+110}, ${x} ${y+28}`;
  if(st.s==="main")main=`<path class="path p-main" d="${d}"/>`;else paths+=`<path class="path p-${st.s}" d="${d}"/>`;
  const fill=st.s==="main"?"#B5652F":st.s==="yes"?"#E4EBDD":"#EFE6D8",ink=st.s==="main"?"#FFFFFF":st.s==="yes"?"#1F3D2B":"#A4937F";
  dests+=`<g class="dest${k===sel?" sel":""}" data-dest="${k}" tabindex="0" role="button" aria-label="${PROD[k].nome}: ${st.chip}">
   ${st.s==="main"?`<rect x="${x-40}" y="${y-72}" width="80" height="22" rx="11" fill="#B5652F"/><text x="${x}" y="${y-57}" text-anchor="middle" font-size="11" fill="#FFFFFF">mais provável</text>`:""}
   <text x="${x}" y="${y-36}" text-anchor="middle" font-size="15" ${st.s==="no"?'fill="#A4937F"':""}>${PROD[k].curto}</text>
   <circle class="ring" cx="${x}" cy="${y}" r="26" fill="${fill}" stroke="${st.s==="main"?"#3B2A20":"#D6C9B6"}" stroke-width="${st.s==="main"?3:2}"/>
   <g transform="translate(${x-11} ${y-11})" style="color:${ink}">${ICON[PROD[k].ic]}</g></g>`});
 return `<svg viewBox="0 0 360 300" role="img" aria-label="Mapa dos caminhos">${paths}${main}${dests}
  <circle cx="${sx}" cy="${sy}" r="10" fill="#1F3D2B"/>
  <text x="${sx}" y="${sy+30}" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20" font-family="DM Sans,system-ui,sans-serif">Você</text></svg>`}
function painel(r,k){const st=status(r,k),p=PROD[k];
 return `<div class="panel"><div class="hd"><b class="n">${p.nome}</b><span class="chip ${st.s}">${st.chip}</span></div>
  <p class="an">${p.an}</p><p>${p.desc}</p><p><b>${st.s==="no"?"Por que não agora: ":"Para você: "}</b>${st.why}</p>${st.s!=="no"?`<p class="note">Possibilidade sujeita à consulta de elegibilidade.</p>`:""}</div>`}
function mvHTML(){
 const dots=MV.map((_,i)=>`<i class="${mvRes[i]===true?"ok":mvRes[i]===false?"err":i===mvI?"now":""}"></i>`).join("");
 const head=`<div class="head"><h3>Mito ou <em>verdade?</em></h3><div class="dots">${dots}</div></div>`;
 if(mvI>=MV.length){const a=mvRes.filter(Boolean).length;return head+`<p class="end">Você acertou ${a} de ${MV.length}! ${a===MV.length?"Já entende mais que muita gente.":"Agora você sabe o que muita gente ainda não sabe."}</p><button class="nx" data-mvr>Jogar de novo ↺</button>`}
 const it=MV[mvI],resp=mvRes[mvI]!==undefined,cls=v=>!resp?"":v===it.r?"right":(mvRes[mvI]===false?"wrong":"");
 return head+`<p class="q">“${it.q}”</p><div class="ch"><button data-mv="mito" class="${cls("mito")}">Mito</button><button data-mv="verdade" class="${cls("verdade")}">Verdade</button></div>
  ${resp?`<div class="ans"><b>${it.r==="mito"?"É mito.":"É verdade."}</b>${it.e}</div><button class="nx" data-mvn>${mvI<MV.length-1?"Próxima →":"Ver meu placar →"}</button>`:""}`}
function mvBind(box){
 box.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{if(mvRes[mvI]!==undefined)return;const ok=b.dataset.mv===MV[mvI].r;mvRes[mvI]=ok;ok?SFX.right():SFX.wrong();buzz(ok?15:[10,30,10]);box.innerHTML=mvHTML();mvBind(box)});
 const n=box.querySelector("[data-mvn]");if(n)n.onclick=()=>{SFX.pop();mvI++;box.innerHTML=mvHTML();mvBind(box);if(mvI>=MV.length&&mvRes.every(Boolean)){SFX.win();confete()}};
 const r=box.querySelector("[data-mvr]");if(r)r.onclick=()=>{mvI=0;mvRes=[];box.innerHTML=mvHTML();mvBind(box)}}
const TIPO={casa:"casa",apto:"apartamento",comercio:"comércio",grande:"empresa grande"},POSSE={proprio:"próprio",alugado:"alugado",cedido:"de família/emprestado"};
function mensagem(r){const d=A.dist==="naosei"?"não sei":A.dist==="outra"?"outra":A.dist;
 return [`Oi, Wesley e Tai! ${A.nome?"Sou "+A.nome+". ":""}Fiz o quiz do Conta Leve.`,`Meu resultado: ${PROD[r.main].nome}${r.semGreen?" (Green como possibilidade futura)":""}`,...(GOALS[A.goal]?[`Meu objetivo: ${GOALS[A.goal].t.toLowerCase()}`]:[]),`Estado: ${A.uf}${A.dist?" · Empresa de luz: "+d:""}`,`Imóvel: ${TIPO[A.tipo]||"-"}${A.posse?", "+POSSE[A.posse]:""}`,"Quero entender melhor!"].join("\n")}
function toast(t){const e=document.getElementById("toast");if(e)e.textContent=t}
function copiar(){const t=document.getElementById("msgTx").textContent;
 const selec=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("msgTx"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Texto selecionado. Copie e cole no WhatsApp.")};
 try{navigator.clipboard.writeText(t).then(()=>{toast("Copiado! Agora é só colar no WhatsApp.");SFX.right()},selec)}catch(e){selec()}}
function bind(el,id){
 el.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{SFX.pop();back()});
 const pl=el.querySelector("[data-play]");if(pl)pl.onclick=()=>{SFX.open();buzz(20);go("goal")};
 const bill=el.querySelector("#bill");
 if(bill)bill.onclick=()=>{if(bill.classList.contains("open"))return;bill.classList.add("open");document.getElementById("legend").hidden=false;SFX.open();buzz(15)};
 el.querySelectorAll("[data-leg]").forEach(b=>b.onclick=()=>{const i=b.dataset.leg;SFX.pop();el.querySelectorAll("[data-seg]").forEach(x=>x.classList.toggle("dim",x.dataset.seg!=i));el.querySelectorAll("[data-leg]").forEach(x=>x.classList.toggle("dim",x.dataset.leg!=i))});
 el.querySelectorAll("[data-goal]").forEach(b=>b.onclick=()=>{A.goal=b.dataset.goal;SFX.pop();buzz(10);el.querySelectorAll(".goal").forEach(x=>x.classList.toggle("on",x===b));setTimeout(()=>next("goal"),300)});
 el.querySelectorAll("[data-uf]").forEach(b=>b.onclick=()=>{if(A.uf!==b.dataset.uf)A.dist="";A.uf=b.dataset.uf;SFX.pop();buzz(10);el.querySelectorAll(".uf").forEach(x=>x.classList.toggle("on",x===b));setTimeout(()=>next("uf"),300)});
 el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
  const k=b.dataset.k;A[k]=b.dataset.v;
  ({tipo:["posse","telhado","invest","multi"],posse:["telhado","invest","multi"],telhado:["invest","multi"],invest:["multi"]}[k]||[]).forEach(x=>A[x]="");
  SFX.pop();buzz(10);el.querySelectorAll(".opt").forEach(x=>x.classList.toggle("on",x===b));setTimeout(()=>next(id),300)});
 if(id==="result"){
  const r=calc();
  el.querySelectorAll("[data-dest]").forEach(g=>{const f=()=>{sel=g.dataset.dest;SFX.pop();buzz(10);el.querySelectorAll("[data-dest]").forEach(x=>x.classList.toggle("sel",x===g));document.getElementById("panel").innerHTML=painel(r,sel)};g.addEventListener("click",f);g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}})});
  mvBind(el.querySelector("#mv"));
  const nm=el.querySelector("#nome");nm.addEventListener("input",()=>{A.nome=nm.value.trim();document.getElementById("msgTx").textContent=mensagem(calc())});
  const zp=el.querySelector("[data-zap]");if(zp)zp.onclick=()=>{if(WHATSAPP){const a=document.createElement("a");a.href="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(document.getElementById("msgTx").textContent);a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();toast("Se o WhatsApp não abrir, use “Copiar meu resultado” e cole na conversa.")}};
  const c=el.querySelector("[data-copy]");if(c)c.onclick=copiar;
  el.querySelector("[data-restart]").onclick=()=>{SFX.pop();Object.keys(A).forEach(k=>{if(k!=="nome")A[k]=""});hist=[];mvI=0;mvRes=[];go("intro")};
 }
}
go("intro");
</script>

</body>
